<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - Tomra Food MLOPS</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .upload-section { border: 2px dashed #ccc; padding: 40px; text-align: center; margin: 20px 0; }
        .progress-bar { width: 100%; height: 20px; background: #f0f0f0; border-radius: 10px; margin: 10px 0; }
        .progress-fill { height: 100%; background: #4CAF50; border-radius: 10px; width: 0%; transition: width 0.3s; }
        .image-preview { max-width: 200px; max-height: 200px; margin: 10px; border: 1px solid #ddd; }
        .success { color: #4CAF50; font-weight: bold; }
        .error { color: #f44336; font-weight: bold; }
        .hidden { display: none; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        input[type="file"] { padding: 10px; margin: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-testid="page-title">Upload Images</h1>
        
        <div class="upload-section">
            <input type="file" data-testid="upload-file-input" accept=".jpg,.jpeg,.png" multiple />
            <button data-testid="upload-submit-button">Upload Images</button>
        </div>
        
        <div data-testid="upload-progress-bar" class="progress-bar hidden">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div data-testid="upload-progress-percentage" class="hidden">0%</div>
        
        <div data-testid="upload-success-message" class="success hidden">Upload completed successfully!</div>
        <div data-testid="upload-error-message" class="error hidden">Upload failed. Please try again.</div>
        <div data-testid="batch-upload-success-message" class="success hidden">All images uploaded successfully!</div>
        
        <div data-testid="uploaded-images-list" class="hidden">
            <h3>Uploaded Images</h3>
            <div id="images-container"></div>
        </div>
        
        <div id="image-previews-container" class="hidden">
            <h3>Image Previews</h3>
            <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                <img data-testid="uploaded-image-preview" class="image-preview hidden" />
                <img data-testid="uploaded-image-preview-2" class="image-preview hidden" />
                <img data-testid="uploaded-image-preview-3" class="image-preview hidden" />
            </div>
        </div>
        
        <div data-testid="image-metadata" class="hidden">
            <h4>Image Metadata</h4>
            <p>Filename: <span id="filename">apple_01.jpg</span></p>
            <p>Size: <span id="filesize">245760</span> bytes</p>
            <p>Type: <span id="filetype">image/jpeg</span></p>
        </div>
        
        <div data-testid="sas-url" class="hidden">
            <h4>Storage URL</h4>
            <input type="text" readonly value="https://tomrastorage.blob.core.windows.net/uploads/apple_01.jpg?sv=2021-06-08&se=2025-10-02T10%3A00%3A00Z&sr=b&sp=r&sig=abcdef123456" />
        </div>
        
        <button data-testid="upload-retry-button" class="hidden">Retry Upload</button>
        <button data-testid="clear-all-images-button" class="hidden">Clear All Images</button>
        <div data-testid="clear-success-message" class="success hidden">All images cleared successfully!</div>
    </div>

    <script>
        // Mock upload functionality with enhanced features
        const fileInput = document.querySelector('[data-testid="upload-file-input"]');
        const uploadButton = document.querySelector('[data-testid="upload-submit-button"]');
        const progressBar = document.querySelector('[data-testid="upload-progress-bar"]');
        const progressFill = document.getElementById('progress-fill');
        const progressPercent = document.querySelector('[data-testid="upload-progress-percentage"]');
        const successMessage = document.querySelector('[data-testid="upload-success-message"]');
        const errorMessage = document.querySelector('[data-testid="upload-error-message"]');
        const batchSuccessMessage = document.querySelector('[data-testid="batch-upload-success-message"]');
        const imagePreview = document.querySelector('[data-testid="uploaded-image-preview"]');
        const imageMetadata = document.querySelector('[data-testid="image-metadata"]');
        const sasUrl = document.querySelector('[data-testid="sas-url"]');
        const uploadedImagesList = document.querySelector('[data-testid="uploaded-images-list"]');
        const imagesContainer = document.getElementById('images-container');
        const clearButton = document.querySelector('[data-testid="clear-all-images-button"]');
        const clearSuccessMessage = document.querySelector('[data-testid="clear-success-message"]');
        
        // Track uploaded images
        let uploadedImages = [];
        
        // File type validation
        function isValidImageFile(file) {
            const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif', 'image/webp'];
            return validTypes.includes(file.type);
        }
        
        // Update metadata display with actual file info
        function updateMetadata(file) {
            const filename = file.name;
            const size = file.size;
            const type = file.type;
            
            document.getElementById('filename').textContent = filename;
            document.getElementById('filesize').textContent = size;
            document.getElementById('filetype').textContent = type;
            
            // Update metadata JSON for page object access
            const metadataJson = {
                filename: filename,
                size: size,
                type: type,
                blob_url: `https://tomrafoodstorage.blob.core.windows.net/images/${filename}`,
                preview_url: `/previews/${filename}`
            };
            
            // Store in hidden element for page object access
            let jsonElement = document.getElementById('metadata-json');
            if (!jsonElement) {
                jsonElement = document.createElement('div');
                jsonElement.id = 'metadata-json';
                jsonElement.style.display = 'none';
                document.body.appendChild(jsonElement);
            }
            jsonElement.textContent = JSON.stringify(metadataJson);
            
            return metadataJson;
        }
        
        // Add image to uploaded list
        function addToUploadedList(file, metadata) {
            const imageItem = {
                filename: file.name,
                size: file.size,
                type: file.type,
                status: 'uploaded',
                preview_url: metadata.preview_url,
                blob_url: metadata.blob_url,
                timestamp: new Date().toISOString()
            };
            
            uploadedImages.push(imageItem);
            
            // Create visual item in the list
            const itemDiv = document.createElement('div');
            itemDiv.className = 'uploaded-image-item';
            itemDiv.innerHTML = `
                <p><strong>${file.name}</strong> (${file.size} bytes)</p>
                <p>Status: ${imageItem.status}</p>
                <p>Type: ${file.type}</p>
            `;
            imagesContainer.appendChild(itemDiv);
            
            // Store JSON list for page object access
            let listElement = document.getElementById('uploaded-images-json');
            if (!listElement) {
                listElement = document.createElement('div');
                listElement.id = 'uploaded-images-json';
                listElement.style.display = 'none';
                document.body.appendChild(listElement);
            }
            listElement.textContent = JSON.stringify(uploadedImages);
        }
        
        uploadButton.addEventListener('click', function() {
            const files = Array.from(fileInput.files);
            
            if (files.length === 0) {
                errorMessage.textContent = 'Please select at least one file.';
                errorMessage.classList.remove('hidden');
                return;
            }
            
            // Validate all files first
            const invalidFiles = files.filter(file => !isValidImageFile(file));
            if (invalidFiles.length > 0) {
                errorMessage.textContent = 'Only image files are supported. Invalid files: ' + invalidFiles.map(f => f.name).join(', ');
                errorMessage.classList.remove('hidden');
                return;
            }
            
            // Hide previous messages
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');
            batchSuccessMessage.classList.add('hidden');
            
            // Show progress
            progressBar.classList.remove('hidden');
            progressPercent.classList.remove('hidden');
            
            // Simulate upload progress
            let progress = 0;
            const interval = setInterval(() => {
                progress += 20;
                progressFill.style.width = progress + '%';
                progressPercent.textContent = progress + '%';
                
                if (progress >= 100) {
                    clearInterval(interval);
                    
                    // Hide progress bar after completion
                    setTimeout(() => {
                        progressBar.classList.add('hidden');
                        progressPercent.classList.add('hidden');
                        
                        // Process each file and show previews
                        const imagePreviewElements = [
                            document.querySelector('[data-testid="uploaded-image-preview"]'),
                            document.querySelector('[data-testid="uploaded-image-preview-2"]'),
                            document.querySelector('[data-testid="uploaded-image-preview-3"]')
                        ];
                        
                        files.forEach((file, index) => {
                            const metadata = updateMetadata(file);
                            addToUploadedList(file, metadata);
                            
                            // Show preview for each image (up to 3)
                            if (index < imagePreviewElements.length && imagePreviewElements[index]) {
                                const reader = new FileReader();
                                reader.onload = function(e) {
                                    imagePreviewElements[index].src = e.target.result;
                                    imagePreviewElements[index].classList.remove('hidden');
                                    
                                    // Add filename label
                                    const label = document.createElement('p');
                                    label.textContent = file.name;
                                    label.style.textAlign = 'center';
                                    label.style.margin = '5px 0';
                                    label.style.fontSize = '12px';
                                    label.style.fontWeight = 'bold';
                                    
                                    // Insert label after the image
                                    if (!imagePreviewElements[index].nextElementSibling || 
                                        !imagePreviewElements[index].nextElementSibling.textContent.includes('.png')) {
                                        imagePreviewElements[index].parentNode.insertBefore(label, imagePreviewElements[index].nextSibling);
                                    }
                                };
                                reader.readAsDataURL(file);
                            }
                        });
                        
                        // Show image previews container if multiple files
                        const previewsContainer = document.getElementById('image-previews-container');
                        if (files.length > 0) {
                            previewsContainer.classList.remove('hidden');
                        }
                        
                        // Show appropriate success message
                        if (files.length === 1) {
                            successMessage.classList.remove('hidden');
                        } else {
                            batchSuccessMessage.classList.remove('hidden');
                        }
                        
                        // Show other elements
                        imageMetadata.classList.remove('hidden');
                        sasUrl.classList.remove('hidden');
                        uploadedImagesList.classList.remove('hidden');
                        clearButton.classList.remove('hidden');
                        
                    }, 500);
                }
            }, 100);
        });
        
        clearButton.addEventListener('click', function() {
            // Clear uploaded images array
            uploadedImages = [];
            
            // Clear visual list
            imagesContainer.innerHTML = '';
            
            // Clear JSON storage
            const listElement = document.getElementById('uploaded-images-json');
            if (listElement) {
                listElement.textContent = JSON.stringify([]);
            }
            
            // Hide elements and show clear message
            uploadedImagesList.classList.add('hidden');
            imagePreview.classList.add('hidden');
            
            // Hide all image previews
            const allPreviews = document.querySelectorAll('[data-testid^="uploaded-image-preview"]');
            allPreviews.forEach(preview => preview.classList.add('hidden'));
            
            // Hide preview container
            const previewsContainer = document.getElementById('image-previews-container');
            previewsContainer.classList.add('hidden');
            
            successMessage.classList.add('hidden');
            batchSuccessMessage.classList.add('hidden');
            imageMetadata.classList.add('hidden');
            sasUrl.classList.add('hidden');
            clearButton.classList.add('hidden');
            
            clearSuccessMessage.classList.remove('hidden');
            
            // Hide clear message after 2 seconds
            setTimeout(() => {
                clearSuccessMessage.classList.add('hidden');
            }, 2000);
        });
    </script>
</body>
</html>
